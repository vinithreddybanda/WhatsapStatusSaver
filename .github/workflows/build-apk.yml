name: Build Android APK

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build GitHub debug APK
        run: ./gradlew --no-daemon clean assembleGithubDebug

      - name: Upload GitHub debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-github-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error

      - name: Build F-Droid release APK
        run: ./gradlew --no-daemon assembleFdroidRelease

      - name: Upload F-Droid release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-fdroid-release-apk
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
